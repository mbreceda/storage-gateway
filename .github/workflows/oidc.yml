name: oidc-debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  infisical:
    runs-on: ubuntu-latest
    steps:
      - uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: 7a11e24f-b33c-4c4c-a83d-7b1d75cb80c9
          project-slug: tgm_media_server
          env-slug: dev
          oidc-audience: infisical
          # **Sin esto el action pide un token con la audiencia por defecto
          # (`https://github.com/<owner>`), y la identidad de Infisical espera
          # `infisical`: devuelve 401 "OIDC audience not allowed".

      - name: Confirmar que llego un secreto (sin imprimirlo)
        run: |
          if [ -z "$TG_FILES_CHAT" ]; then
            echo "FALLO: no llego el secreto"
            exit 1
          fi
          echo "OK: secreto leido, longitud ${#TG_FILES_CHAT}"
          echo "OK: otro secreto presente: $([ -n "$R2_BUCKET" ] && echo si || echo no)"
